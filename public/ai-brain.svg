<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brain-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Central brain structure -->
  <g filter="url(#glow)">
    <!-- Left hemisphere -->
    <path d="M 150 200 Q 120 150 150 100 Q 180 80 200 100 Q 210 120 200 150 Q 190 180 180 200 Q 170 220 150 200 Z" 
          fill="none" stroke="url(#brain-gradient)" stroke-width="3" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Right hemisphere -->
    <path d="M 250 200 Q 280 150 250 100 Q 220 80 200 100 Q 190 120 200 150 Q 210 180 220 200 Q 230 220 250 200 Z" 
          fill="none" stroke="url(#brain-gradient)" stroke-width="3" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    
    <!-- Neural connections -->
    <g opacity="0.6">
      <line x1="150" y1="120" x2="250" y2="120" stroke="#0EA5E9" stroke-width="2">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="160" y1="150" x2="240" y2="150" stroke="#10B981" stroke-width="2">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
      </line>
      <line x1="170" y1="180" x2="230" y2="180" stroke="#8B5CF6" stroke-width="2">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Neural nodes -->
    <circle cx="150" cy="120" r="4" fill="#0EA5E9">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="120" r="4" fill="#0EA5E9">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="160" cy="150" r="4" fill="#10B981">
      <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="150" r="4" fill="#10B981">
      <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="170" cy="180" r="4" fill="#8B5CF6">
      <animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="180" r="4" fill="#8B5CF6">
      <animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="200" cy="100" r="5" fill="#0EA5E9">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="5" fill="#10B981">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
  
  <!-- Orbiting particles -->
  <g>
    <circle cx="200" cy="200" r="3" fill="#0EA5E9">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="3" fill="#10B981">
      <animateTransform attributeName="transform" type="rotate" from="120 200 200" to="480 200 200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" begin="1.3s"/>
    </circle>
    <circle cx="200" cy="200" r="3" fill="#8B5CF6">
      <animateTransform attributeName="transform" type="rotate" from="240 200 200" to="600 200 200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" begin="2.6s"/>
    </circle>
  </g>
  
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#brain-gradient)" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="120;125;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
