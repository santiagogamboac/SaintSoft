<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloud-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cloud shape -->
  <g opacity="0.8">
    <ellipse cx="250" cy="120" rx="80" ry="50" fill="url(#cloud-gradient)" opacity="0.2"/>
    <ellipse cx="200" cy="130" rx="60" ry="40" fill="url(#cloud-gradient)" opacity="0.3"/>
    <ellipse cx="300" cy="130" rx="60" ry="40" fill="url(#cloud-gradient)" opacity="0.3"/>
    <rect x="170" y="120" width="160" height="40" fill="url(#cloud-gradient)" opacity="0.25"/>
    
    <!-- Cloud outline -->
    <path d="M 170 140 Q 170 100 210 100 Q 220 80 250 80 Q 280 80 290 100 Q 330 100 330 140 Q 330 160 310 160 L 190 160 Q 170 160 170 140 Z" 
          fill="none" stroke="url(#cloud-gradient)" stroke-width="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Data nodes -->
  <g>
    <!-- Top nodes -->
    <circle cx="150" cy="220" r="8" fill="#0EA5E9" opacity="0.8">
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="220" r="8" fill="#10B981" opacity="0.8">
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="350" cy="220" r="8" fill="#0EA5E9" opacity="0.8">
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- Connection lines to cloud -->
    <line x1="150" y1="220" x2="200" y2="160" stroke="#0EA5E9" stroke-width="2" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="220" x2="250" y2="160" stroke="#10B981" stroke-width="2" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="350" y1="220" x2="300" y2="160" stroke="#0EA5E9" stroke-width="2" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1s"/>
    </line>
    
    <!-- Data packets moving up -->
    <circle cx="150" cy="220" r="3" fill="#0EA5E9">
      <animate attributeName="cy" values="220;160" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="220" r="3" fill="#10B981">
      <animate attributeName="cy" values="220;160" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="350" cy="220" r="3" fill="#0EA5E9">
      <animate attributeName="cy" values="220;160" dur="2s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
  </g>
  
  <!-- Server racks -->
  <g opacity="0.6">
    <rect x="130" y="240" width="40" height="50" rx="4" fill="none" stroke="#0EA5E9" stroke-width="2"/>
    <line x1="135" y1="250" x2="165" y2="250" stroke="#0EA5E9" stroke-width="1"/>
    <line x1="135" y1="260" x2="165" y2="260" stroke="#0EA5E9" stroke-width="1"/>
    <line x1="135" y1="270" x2="165" y2="270" stroke="#0EA5E9" stroke-width="1"/>
    
    <rect x="230" y="240" width="40" height="50" rx="4" fill="none" stroke="#10B981" stroke-width="2"/>
    <line x1="235" y1="250" x2="265" y2="250" stroke="#10B981" stroke-width="1"/>
    <line x1="235" y1="260" x2="265" y2="260" stroke="#10B981" stroke-width="1"/>
    <line x1="235" y1="270" x2="265" y2="270" stroke="#10B981" stroke-width="1"/>
    
    <rect x="330" y="240" width="40" height="50" rx="4" fill="none" stroke="#0EA5E9" stroke-width="2"/>
    <line x1="335" y1="250" x2="365" y2="250" stroke="#0EA5E9" stroke-width="1"/>
    <line x1="335" y1="260" x2="365" y2="260" stroke="#0EA5E9" stroke-width="1"/>
    <line x1="335" y1="270" x2="365" y2="270" stroke="#0EA5E9" stroke-width="1"/>
  </g>
</svg>
