<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="code-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Code window -->
  <rect x="50" y="50" width="500" height="300" rx="10" fill="#1A1A1A" stroke="url(#code-gradient)" stroke-width="2"/>
  
  <!-- Window controls -->
  <circle cx="70" cy="70" r="6" fill="#FF5F56"/>
  <circle cx="90" cy="70" r="6" fill="#FFBD2E"/>
  <circle cx="110" cy="70" r="6" fill="#27C93F"/>
  
  <!-- Code lines with animation -->
  <g opacity="0.8">
    <rect x="70" y="100" width="120" height="8" rx="4" fill="#0EA5E9">
      <animate attributeName="width" values="120;140;120" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="120" width="200" height="8" rx="4" fill="#10B981">
      <animate attributeName="width" values="200;220;200" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="140" width="180" height="8" rx="4" fill="#0EA5E9">
      <animate attributeName="width" values="180;200;180" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="160" width="150" height="8" rx="4" fill="#10B981">
      <animate attributeName="width" values="150;170;150" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="70" y="190" width="100" height="8" rx="4" fill="#0EA5E9">
      <animate attributeName="width" values="100;120;100" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="210" width="220" height="8" rx="4" fill="#10B981">
      <animate attributeName="width" values="220;240;220" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="230" width="160" height="8" rx="4" fill="#0EA5E9">
      <animate attributeName="width" values="160;180;160" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="250" width="140" height="8" rx="4" fill="#10B981">
      <animate attributeName="width" values="140;160;140" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Cursor blink -->
  <rect x="200" y="250" width="3" height="10" fill="#0EA5E9">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Floating particles -->
  <circle cx="450" cy="150" r="3" fill="#0EA5E9" opacity="0.6">
    <animate attributeName="cy" values="150;130;150" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="200" r="2" fill="#10B981" opacity="0.6">
    <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="280" r="2.5" fill="#0EA5E9" opacity="0.6">
    <animate attributeName="cy" values="280;260;280" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
